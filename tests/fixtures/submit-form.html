<!doctype html>
<!-- A SYNTHETIC application form for tests/test_submit_browser.py. It copies the markup shapes
     of a hosted Greenhouse form (labelled inputs, react-select style controls with a
     .select__input inside .select__control, a hidden file input, a phone input) and belongs to
     no employer. Every value the test types is invented. -->
<html><head><meta charset="utf-8"><title>Apply: Example Role at Example Co</title>
<style>
  body { font: 14px sans-serif; max-width: 720px; margin: 20px auto; }
  .field { margin: 12px 0; }
  .select__control { border: 1px solid #888; padding: 6px; position: relative; cursor: pointer; }
  .select__input { border: 0; outline: 0; width: 60%; }
  .select__menu { position: absolute; left: 0; right: 0; top: 100%; background: #fff; border: 1px solid #888; z-index: 9; }
  .select__option { padding: 4px 6px; }
  .visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
</style></head>
<body>
<h1>Example Role</h1>
<form id="application" method="post" action="/submitted">
  <div class="field"><label for="first_name">First Name*</label>
    <input type="text" id="first_name" aria-required="true"></div>
  <div class="field"><label for="last_name">Last Name*</label>
    <input type="text" id="last_name" aria-required="true"></div>
  <div class="field"><label for="email">Email*</label>
    <input type="text" id="email" aria-required="true"></div>
  <div class="field"><label for="phone">Phone*</label>
    <input type="tel" id="phone" aria-required="true"></div>
  <div class="field"><label for="country">Country*</label>
    <div class="select__control"><input class="select__input" id="country" aria-required="true"
      data-options="Canada +1|United Kingdom +44|United States +1|Uruguay +598" data-flags="ca|gb|us|uy"></div></div>
  <div class="field"><label for="resume">Attach</label>
    <input type="file" id="resume" class="visually-hidden"><span id="resume-name"></span></div>
  <div class="field"><label for="cover_letter">Attach</label>
    <input type="file" id="cover_letter" class="visually-hidden"><span id="cover-name"></span></div>
  <div class="field"><label for="question_101">LinkedIn Profile</label>
    <input type="text" id="question_101"></div>
  <div class="field"><label for="question_102">Will you now or in the future require sponsorship?*</label>
    <div class="select__control"><input class="select__input" id="question_102" aria-required="true"
      data-options="Yes|No"></div></div>
  <div class="field"><label for="question_103">Why do you want to work here?*</label>
    <textarea id="question_103" aria-required="true"></textarea></div>
  <div class="field"><label for="question_104">Website</label>
    <input type="text" id="question_104"></div>
  <div class="field"><label for="gender">Gender</label>
    <div class="select__control"><input class="select__input" id="gender"
      data-options="Man|Woman|Non-binary|Decline to self-identify"></div></div>
  <div id="code-step" hidden>
    <p>A verification code was sent to acme@jobs.example.com. To submit your application, enter the
       8-character code to confirm you're a human.</p>
    <label>Security code</label>
    <div id="code-boxes"></div>
    <button type="button" id="resend">Resend code</button>
  </div>
  <button type="submit">Submit application</button>
</form>
<script>
  // react-select imitation: open on click, filter on typing, commit only on an option click.
  document.querySelectorAll('.select__control').forEach((ctl) => {
    const input = ctl.querySelector('.select__input');
    const opts = input.dataset.options.split('|');
    const flags = (input.dataset.flags || '').split('|');
    let menu = null, single = null;
    const close = () => { if (menu) { menu.remove(); menu = null; } };
    const render = () => {
      close();
      menu = document.createElement('div'); menu.className = 'select__menu';
      const q = input.value.toLowerCase();
      opts.filter((o) => o.toLowerCase().includes(q)).forEach((o) => {
        const flag = flags[opts.indexOf(o)];
        // Like Greenhouse: a wrapper .select__option AND an inner role="option" per option, so a
        // selector for either finds every option text twice.
        const d = document.createElement('div'); d.className = 'select__option';
        const inner = document.createElement('div'); inner.setAttribute('role', 'option'); inner.textContent = o;
        d.appendChild(inner);
        // ...and, for the country picker, a second copy whose spacing differs ("Canada+1"), as a
        // separate node the option selector also matches.
        let twin = null;
        if (flag) { twin = document.createElement('div'); twin.setAttribute('role', 'option');
                    twin.textContent = o.replace(' +', '+'); twin.style.height = '0'; twin.style.overflow = 'hidden'; }
        d.addEventListener('mousedown', (e) => {
          e.preventDefault();
          if (!single) { single = document.createElement('div'); single.className = 'select__single-value'; ctl.insertBefore(single, input); }
          // A country picker, like Greenhouse's: the chosen value is a flag (ISO code in its
          // class) and the dial code only.
          if (flag) single.innerHTML = '<div class="iti__flag iti__' + flag + '"></div><span>' + o.split(' ').pop() + '</span>';
          else single.textContent = o;
          input.value = ''; close();
        });
        menu.appendChild(d);
        if (twin) menu.appendChild(twin);
      });
      ctl.appendChild(menu);
    };
    ctl.addEventListener('click', () => { input.focus(); render(); });
    input.addEventListener('input', render);
    input.addEventListener('keydown', (e) => { if (e.key === 'Escape') close(); });
  });
  // The cover letter keeps its input and shows the name beside it. The resume behaves like a hosted
  // Greenhouse form: once a file is chosen, the input is REMOVED and a filename chip takes its place.
  document.getElementById('cover_letter').addEventListener('change', (e) => {
    document.getElementById('cover-name').textContent = [...e.target.files].map((f) => f.name).join(', ');
  });
  document.getElementById('resume').addEventListener('change', (e) => {
    const name = [...e.target.files].map((f) => f.name).join(', ');
    setTimeout(() => {
      const chip = document.createElement('span'); chip.className = 'chip'; chip.textContent = name + ' ×';
      e.target.replaceWith(chip);
    }, 200);
  });
  // A page that edits a value after it is typed, so the read-back has something to catch.
  document.getElementById('question_104').addEventListener('input', (e) => {
    if (!e.target.value.endsWith('/edited')) e.target.value = e.target.value + '/edited';
  });
  // A page that tries to submit on its own, so both guards in form.js are tested:
  // requestSubmit() fires a submit event; form.submit() skips the event and POSTs directly.
  document.getElementById('question_101').addEventListener('input', (e) => {
    const f = document.getElementById('application');
    if (e.target.value === 'submit-me') f.requestSubmit();
    if (e.target.value === 'post-me') f.submit();
    // A submit() borrowed from a fresh frame, the usual way round a patched prototype.
    if (e.target.value === 'bypass-me') {
      const fr = document.createElement('iframe'); document.body.appendChild(fr);
      fr.contentWindow.HTMLFormElement.prototype.submit.call(f);
    }
  });
  // ?code=1: like Greenhouse, the FIRST submit sends a background request and shows an emailed
  // security-code step with 8 one-character boxes; only a submit with all 8 filled posts the form.
  if (new URLSearchParams(location.search).get('code') === '1') {
    const form = document.getElementById('application');
    const step = document.getElementById('code-step'), boxes = document.getElementById('code-boxes');
    for (let i = 0; i < 8; i++) {
      const b = document.createElement('input'); b.type = 'text'; b.maxLength = 1; b.size = 1;
      b.addEventListener('input', () => { if (b.value && b.nextElementSibling) b.nextElementSibling.focus(); });
      boxes.appendChild(b);
    }
    document.getElementById('resend').addEventListener('click', () => fetch('/resend-code', { method: 'POST' }));
    form.addEventListener('submit', (e) => {
      if (step.hidden) {
        e.preventDefault();
        fetch('/request-code', { method: 'POST' });
        step.hidden = false;
        return;
      }
      const code = [...boxes.querySelectorAll('input')].map((b) => b.value).join('');
      if (code.length !== 8) { e.preventDefault(); return; }
      if (code === 'Bad00000') {                // the board refuses a wrong code and stays on the form
        e.preventDefault();
        const p = document.createElement('p'); p.textContent = 'That security code is invalid. Please try again.';
        step.appendChild(p);
        return;
      }
      form.action = '/submitted?code=' + encodeURIComponent(code);
    });
  }
</script>
</body></html>
